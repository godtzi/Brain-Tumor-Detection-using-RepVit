<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Tumor Screening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf5 40%, #dbe4f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  body::before {
    top: -15%;
    left: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(120,150,255,0.35) 0%, rgba(120,150,255,0) 70%);
    animation: float1 14s ease-in-out infinite;
  }

  body::after {
    bottom: -15%;
    right: -10%;
    width: 550px;
    height: 550px;
    background: radial-gradient(circle, rgba(255,150,200,0.3) 0%, rgba(255,150,200,0) 70%);
    animation: float2 16s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, 80px) scale(1.1); }
  }

  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-50px, -60px) scale(1.15); }
  }

  header {
    text-align: center;
    padding: 56px 20px 12px;
    position: relative;
    z-index: 1;
    animation: fadeInDown 0.8s ease;
  }

  header h1 {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #1d1d1f, #4a4a52);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  header p {
    font-size: 17px;
    color: #6e6e73;
    font-weight: 400;
  }

  main {
    width: 100%;
    max-width: 920px;
    padding: 24px 20px 60px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    position: relative;
    z-index: 1;
  }

  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.12), inset 0 1px 0 rgba(255,255,255,0.6);
    padding: 28px;
    animation: fadeInUp 0.7s ease 0.15s backwards;
    transition: box-shadow 0.3s ease;
  }

  .glass-card:hover {
    box-shadow: 0 12px 40px rgba(31, 38, 135, 0.18), inset 0 1px 0 rgba(255,255,255,0.6);
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dropzone {
    border: 2px dashed rgba(120,130,150,0.35);
    border-radius: 18px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
    position: relative;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .dropzone:hover, .dropzone.dragover {
    border-color: #0071e3;
    background: rgba(0, 113, 227, 0.05);
  }

  .dropzone img {
    max-width: 100%;
    max-height: 260px;
    border-radius: 12px;
    display: none;
  }

  .dropzone .placeholder {
    color: #6e6e73;
    font-size: 15px;
  }

  .dropzone .placeholder svg {
    width: 40px;
    height: 40px;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  input[type="file"] { display: none; }

  button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #0071e3, #42a5f5);
    color: white;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 113, 227, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 113, 227, 0.45);
  }

  button:active:not(:disabled) { transform: translateY(0) scale(0.99); }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .result-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 320px;
  }

  .result-panel .empty {
    text-align: center;
    color: #86868b;
    font-size: 15px;
  }

  .gradcam-img {
    width: 100%;
    border-radius: 14px;
    margin-bottom: 16px;
    display: block;
  }

  .result-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }

  .result-title.tumor { color: #d70015; }
  .result-title.normal { color: #1e8e3e; }

  .confidence {
    font-size: 15px;
    color: #6e6e73;
    margin-bottom: 20px;
  }

  .bar-row {
    margin-bottom: 14px;
  }

  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #3a3a3c;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .bar-track {
    width: 100%;
    height: 10px;
    border-radius: 6px;
    background: rgba(120,130,150,0.15);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 6px;
    width: 0%;
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar-fill.normal { background: linear-gradient(90deg, #34c759, #30d158); }
  .bar-fill.tumor { background: linear-gradient(90deg, #ff453a, #ff6961); }

  .disclaimer {
    margin-top: 20px;
    font-size: 12.5px;
    color: #86868b;
    line-height: 1.5;
  }

  .spinner {
    width: 24px;
    height: 24px;
    border: 3px solid rgba(0,113,227,0.2);
    border-top-color: #0071e3;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center;
    color: #86868b;
    font-size: 13px;
    padding: 0 20px 40px;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>

<header>
  <h1>Brain Tumor Screening</h1>
  <p>Upload an MRI scan for instant AI-assisted analysis</p>
</header>

<main>
  <div class="glass-card">
    <div class="dropzone" id="dropzone">
      <img id="preview" alt="preview">
      <div class="placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>Click or drag an MRI image here</div>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*">
    <button id="analyzeBtn" disabled>Analyze Scan</button>
  </div>

  <div class="glass-card result-panel" id="resultPanel">
    <div class="empty" id="emptyState">Results will appear here after you analyze a scan.</div>
  </div>
</main>

<footer>
  Prototype for research purposes only — not a substitute for professional medical diagnosis.
</footer>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const placeholder = document.getElementById('placeholder');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const resultPanel = document.getElementById('resultPanel');
  const emptyState = document.getElementById('emptyState');

  let selectedFile = null;

  dropzone.addEventListener('click', () => fileInput.click());

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });

  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));

  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      handleFile(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  function handleFile(file) {
    if (!file.type.startsWith('image/')) return;
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      preview.src = e.target.result;
      preview.style.display = 'block';
      placeholder.style.display = 'none';
    };
    reader.readAsDataURL(file);
    analyzeBtn.disabled = false;
  }

  analyzeBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    analyzeBtn.disabled = true;
    analyzeBtn.textContent = 'Analyzing...';
    resultPanel.innerHTML = '<div class="spinner"></div>';

    const formData = new FormData();
    formData.append('image', selectedFile);

    try {
      const res = await fetch('/predict', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.error) {
        resultPanel.innerHTML = `<div class="empty">${data.error}</div>`;
      } else {
        renderResult(data);
      }
    } catch (err) {
      resultPanel.innerHTML = '<div class="empty">Something went wrong. Try again.</div>';
    }

    analyzeBtn.disabled = false;
    analyzeBtn.textContent = 'Analyze Scan';
  });

  function renderResult(data) {
    const isTumor = data.label === 'tumor';
    const titleClass = isTumor ? 'tumor' : 'normal';
    const titleText = isTumor ? '⚠️ Tumor detected' : '✅ No tumor detected';

    resultPanel.innerHTML = `
      <img class="gradcam-img" src="data:image/png;base64,${data.gradcam}" alt="Grad-CAM heatmap">
      <div class="result-title ${titleClass}">${titleText}</div>
      <div class="confidence">Confidence: ${data.confidence}%</div>

      <div class="bar-row">
        <div class="bar-label"><span>Normal</span><span>${data.prob_normal}%</span></div>
        <div class="bar-track"><div class="bar-fill normal" style="width:0%"></div></div>
      </div>

      <div class="bar-row">
        <div class="bar-label"><span>Tumor</span><span>${data.prob_tumor}%</span></div>
        <div class="bar-track"><div class="bar-fill tumor" style="width:0%"></div></div>
      </div>

      <div class="disclaimer">
        This is an automated screening result, not a medical diagnosis.
        Please consult a radiologist or physician for a confirmed evaluation.
      </div>
    `;

    requestAnimationFrame(() => {
      document.querySelector('.bar-fill.normal').style.width = data.prob_normal + '%';
      document.querySelector('.bar-fill.tumor').style.width = data.prob_tumor + '%';
    });
  }
</script>

</body>
</html>
